services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: heartwood_test
    ports:
      # Distinct from the default 5432 so this doesn't clash with a local Postgres.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test']
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      # Test data never needs to survive a restart; memory-backed means fast, clean runs.
      - /var/lib/postgresql/data
